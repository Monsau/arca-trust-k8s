apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: trust
  namespace: trust
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: trust
  namespace: trust
subjects:
  - kind: ServiceAccount
    name: trust
    namespace: trust
roleRef:
  kind: Role
  name: trust
  apiGroup: rbac.authorization.k8s.io

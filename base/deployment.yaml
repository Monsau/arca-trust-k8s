apiVersion: apps/v1
kind: Deployment
metadata:
  name: trust
  namespace: trust
  labels:
    app.kubernetes.io/name: trust
    app.kubernetes.io/part-of: arca-suite
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: trust
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trust
        app.kubernetes.io/part-of: arca-suite
    spec:
      serviceAccountName: trust
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: trust
          image: server01:5000/arca-suite/arca-trust:0.1.1
          ports:
            - containerPort: 8090
          envFrom:
            - configMapRef:
                name: trust-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: trust-secrets
                  key: DATABASE_URL
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # The image ships neither curl nor the scripts/ directory: probe
          # the app's own HTTP endpoint instead.
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8090
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8090
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /healthz
              port: 8090
            failureThreshold: 30
            periodSeconds: 2
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi

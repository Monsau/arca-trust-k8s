apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - ../../base/namespace
commonLabels:
  environment: prod
# Per-environment patches (replicas, resources, hosts) are added in later passes.
patches:
  - target:
      kind: ConfigMap
      name: trust-config
    patch: |-
      - op: replace
        path: /data/ENVIRONMENT
        value: "prod"

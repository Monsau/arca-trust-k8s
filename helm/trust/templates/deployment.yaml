{{- if .Values.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "trust.fullname" . }}
  namespace: {{ .Values.namespaceOverride | default .Release.Namespace }}
  labels:
    {{- include "trust.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "trust.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "trust.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "trust.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: {{ include "trust.fullname" . }}
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8090
          envFrom:
            - configMapRef:
                name: trust-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: trust-secrets
                  key: DATABASE_URL
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            exec:
              command: ["/app/scripts/healthcheck.sh"]
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8090
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /healthz
              port: 8090
            failureThreshold: 30
            periodSeconds: 2
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
{{- end -}}

# Default values — NO secrets here (Vault/ESO).
enabled: true
namespaceOverride: ""
fullnameOverride: ""

image:
  repository: registry.arca.local/arca-trust
  tag: "0.1.4"
  pullPolicy: IfNotPresent

replicaCount: 2

serviceAccount:
  create: true
  name: ""

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

securityContext:
  runAsNonRoot: true
  runAsUser: 10001
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false

env:
  KAFKA_BOOTSTRAP_SERVERS: "kafka.platform.svc.cluster.local:9092"
  TRUST_KAFKA_CONSUME: "1"
